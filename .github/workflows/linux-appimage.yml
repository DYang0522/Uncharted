name: Linux AppImage

on:
  push:
    branches: [linux-appimage]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous build on this branch.
concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-appimage:
    runs-on: ubuntu-26.04
    # GitHub's 26.04 VM can be amd64v3. Build inside the generic amd64 image so
    # the shipped ELF files remain usable on Sandy Bridge (including the i7-2700K).
    container:
      image: ubuntu:26.04
      options: --user root
    timeout-minutes: 180

    steps:
      - name: Restore APT package archives
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives
          key: ubuntu-26.04-apt-${{ github.run_id }}
          restore-keys: |
            ubuntu-26.04-apt-

      - name: Prepare container for checkout
        run: |
          # Keep downloaded .deb files so the workflow cache can reuse them.
          rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p "$GITHUB_WORKSPACE/.ci-cache/ccache" /var/cache/apt/archives
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git rsync

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Compute pinned submodule revisions
        id: submodule-revisions
        run: |
          submodule_hash="$(git ls-tree -r HEAD | awk '$1 == "160000" { print $3 }' | sort | sha256sum | cut -d' ' -f1)"
          test -n "$submodule_hash"
          echo "hash=$submodule_hash" >> "$GITHUB_OUTPUT"

      - name: Restore Git submodule cache
        id: submodule-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .git/modules
            gow3_pc/gpu/third_party/fsr-vulkan
            gow3_pc/gpu/third_party/imgui
            gow3_pc/gpu/third_party/magic_enum
            gow3_pc/gpu/third_party/miniz
            gow3_pc/gpu/third_party/xbyak
            gow3_pc/third_party/LibAtrac9
          key: ubuntu-26.04-submodules-${{ steps.submodule-revisions.outputs.hash }}

      - name: Fetch Git submodules on cache miss
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global core.autocrlf false
          git submodule update --init --recursive

      - name: Save Git submodule cache
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .git/modules
            gow3_pc/gpu/third_party/fsr-vulkan
            gow3_pc/gpu/third_party/imgui
            gow3_pc/gpu/third_party/magic_enum
            gow3_pc/gpu/third_party/miniz
            gow3_pc/gpu/third_party/xbyak
            gow3_pc/third_party/LibAtrac9
          key: ubuntu-26.04-submodules-${{ steps.submodule-revisions.outputs.hash }}

      - name: Verify generic Ubuntu 26.04 amd64 environment
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$(dpkg --print-architecture)" = amd64
          if apt-config dump | grep -Eqi 'APT::Architecture-Variants.*amd64v3'; then
            echo 'Refusing an amd64v3 package environment; this build must target Sandy Bridge.' >&2
            exit 1
          fi
          cat /etc/os-release
          apt-config dump | grep -i 'Architecture-Variants' || true

      - name: Restore prebuilt native dependencies
        id: native-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: /usr/local
          key: ubuntu-26.04-native-deps-${{ hashFiles('gow3_pc/packaging/linux/ci-deps.sh') }}

      - name: Install native Linux build dependencies
        env:
          GOW3_NATIVE_DEPS_CACHE_HIT: ${{ steps.native-deps-cache.outputs.cache-hit }}
        run: bash gow3_pc/packaging/linux/ci-deps.sh

      - name: Save prebuilt native dependencies
        if: steps.native-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local
          key: ubuntu-26.04-native-deps-${{ hashFiles('gow3_pc/packaging/linux/ci-deps.sh') }}

      - name: Restore C/C++ compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ci-cache/ccache
          key: ubuntu-26.04-ccache-${{ github.run_id }}
          restore-keys: |
            ubuntu-26.04-ccache-

      - name: Build Linux runtime
        env:
          GOW3_PGO: off
          GOW3_LTO: "ON"
          GOW3_VULKAN_INCLUDE_DIR: /usr/local/include
          CC: gcc-14
          CXX: g++-14
          CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPILERCHECK: content
        run: |
          gcc --version
          g++ --version
          git config --global core.autocrlf false
          git config --global --add safe.directory '*'
          bash gow3_pc/build.sh
          file gow3_pc/out/gow3-probe
          file gow3_pc/out/gow3-gpu-capabilities
          file gow3_pc/out/gpu/libgow3gpu.so
          ldd gow3_pc/out/gow3-probe | tee "$RUNNER_TEMP/runtime-ldd.txt"
          ldd gow3_pc/out/gpu/libgow3gpu.so | tee "$RUNNER_TEMP/gpu-ldd.txt"
          ! grep -q "not found" "$RUNNER_TEMP/runtime-ldd.txt"
          ! grep -q "not found" "$RUNNER_TEMP/gpu-ldd.txt"

      - name: Run native runtime tests
        env:
          GOW3_PGO: off
          GOW3_LTO: "ON"
          GOW3_VULKAN_INCLUDE_DIR: /usr/local/include
          CC: gcc-14
          CXX: g++-14
          CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPILERCHECK: content
        run: |
          mkdir -p "$HOME/.local/share"
          bash gow3_pc/build.sh --test

      - name: Save C/C++ compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ci-cache/ccache
          key: ubuntu-26.04-ccache-${{ github.run_id }}

      - name: Install relocatable Python for the AppImage
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Restore standalone Python cache
        id: python-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/uv-python
          key: ubuntu-26.04-python-3.12-v1

      - name: Prepare Python 3.12 with Tk
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        run: |
          uv python install 3.12
          python_dir="$(uv python dir)"
          python_standalone="$(find "$python_dir" -mindepth 1 -maxdepth 1 -type d -name 'cpython-3.12*' -print -quit)"
          test -n "$python_standalone"
          test -x "$python_standalone/bin/python3"
          "$python_standalone/bin/python3" -c 'import tkinter; print("Tk:", tkinter.TkVersion)'
          echo "PYTHON_STANDALONE=$python_standalone" >> "$GITHUB_ENV"

      - name: Save standalone Python cache
        if: steps.python-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/uv-python
          key: ubuntu-26.04-python-3.12-v1

      - name: Restore AppImage tooling cache
        id: appimage-tool-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/appimage-tools
          key: ubuntu-26.04-appimage-tools-v1

      - name: Fetch pinned AppImage tooling
        run: |
          set -euo pipefail
          tool_cache="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tool_cache"
          appimagetool="$tool_cache/appimagetool-x86_64.AppImage"
          runtime="$tool_cache/runtime-x86_64"
          if [[ ! -s "$appimagetool" ]]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
              --output "$appimagetool"
          fi
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $appimagetool" | sha256sum --check
          chmod +x "$appimagetool"
          if [[ ! -s "$runtime" ]]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 \
              --output "$runtime"
          fi
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $runtime" | sha256sum --check
          chmod +x "$runtime"
          if [[ ! -x "$tool_cache/squashfs-root/AppRun" ]]; then
            (cd "$tool_cache" && "$appimagetool" --appimage-extract >/dev/null)
          fi
          test -x "$tool_cache/squashfs-root/AppRun"
          echo "APPIMAGETOOL=$tool_cache/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Save AppImage tooling cache
        if: steps.appimage-tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/appimage-tools
          key: ubuntu-26.04-appimage-tools-v1

      - name: Assemble Linux AppImage
        run: |
          test -x "$APPIMAGETOOL"
          test -x "$PYTHON_STANDALONE/bin/python3"
          bash tools/appimage/build_appimage.sh
          cd dist
          sha256sum ./*.AppImage > SHA256SUMS
          file ./*.AppImage
          cat SHA256SUMS

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Uncharted-Linux-AppImage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Uncharted-Linux-build-logs
          path: |
            gow3_pc/out/gpu-build.log
            ${{ runner.temp }}/runtime-ldd.txt
            ${{ runner.temp }}/gpu-ldd.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Save APT package archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/cache/apt/archives
          key: ubuntu-26.04-apt-${{ github.run_id }}
